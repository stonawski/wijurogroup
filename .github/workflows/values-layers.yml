name: Build values chair layers

on:
  push:
    branches:
      - feat/interactive-values-table

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/interactive-values-table
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install imaging dependencies
        run: pip install --quiet pillow numpy opencv-python-headless

      - name: Generate transparent chair and photographic patch layers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import cv2
          import numpy as np
          from PIL import Image

          root = Path("public/values")
          image_path = root / "values-table.jpg"
          image_bgr = cv2.imread(str(image_path), cv2.IMREAD_COLOR)
          if image_bgr is None:
              raise SystemExit("Missing values-table.jpg")

          names = {
              "top": "mask-top.png",
              "left": "mask-left.png",
              "right": "mask-right.png",
              "bottom-left": "mask-bottom-left.png",
              "bottom-right": "mask-bottom-right.png",
          }

          image_rgb = cv2.cvtColor(image_bgr, cv2.COLOR_BGR2RGB)

          for name, filename in names.items():
              mask_gray = cv2.imread(str(root / filename), cv2.IMREAD_GRAYSCALE)
              if mask_gray is None:
                  raise SystemExit(f"Missing {filename}")
              if mask_gray.shape != image_bgr.shape[:2]:
                  mask_gray = cv2.resize(
                      mask_gray,
                      (image_bgr.shape[1], image_bgr.shape[0]),
                      interpolation=cv2.INTER_LINEAR,
                  )

              # Convert the black/white authoring masks into clean alpha.
              _, binary = cv2.threshold(mask_gray, 95, 255, cv2.THRESH_BINARY)
              binary = cv2.morphologyEx(
                  binary,
                  cv2.MORPH_CLOSE,
                  np.ones((5, 5), np.uint8),
                  iterations=1,
              )
              chair_alpha = cv2.GaussianBlur(binary, (0, 0), 0.7)

              chair_rgba = np.dstack([image_rgb, chair_alpha])
              Image.fromarray(chair_rgba, "RGBA").save(
                  root / f"chair-{name}.webp",
                  "WEBP",
                  quality=94,
                  method=6,
              )

              # Cover a few pixels beyond the chair edge, then reconstruct the
              # local photographic background only inside that silhouette.
              patch_mask = cv2.dilate(
                  binary,
                  np.ones((9, 9), np.uint8),
                  iterations=1,
              )
              inpainted = cv2.inpaint(
                  image_bgr,
                  patch_mask,
                  6,
                  cv2.INPAINT_TELEA,
              )
              patch_rgb = cv2.cvtColor(inpainted, cv2.COLOR_BGR2RGB)
              patch_alpha = cv2.GaussianBlur(patch_mask, (0, 0), 1.4)
              patch_rgba = np.dstack([patch_rgb, patch_alpha])
              Image.fromarray(patch_rgba, "RGBA").save(
                  root / f"patch-{name}.webp",
                  "WEBP",
                  quality=93,
                  method=6,
              )

              coverage = int((binary > 0).sum())
              print(name, "mask pixels:", coverage)

          PY

      - name: Commit generated layers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/values/chair-*.webp public/values/patch-*.webp
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate clean values chair layers"
          git push origin HEAD:feat/interactive-values-table
